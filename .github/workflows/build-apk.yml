name: Build & Release HyperMirror Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Verify & Build APK from Source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        working-directory: ./android-sender
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload HyperMirrorSender APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperMirrorSender-debug-apk
          path: android-sender/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  publish-release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-apk
    runs-on: ubuntu-latest
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: HyperMirrorSender-debug-apk
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "HyperMirror Pro ${{ github.ref_name }}"
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: dist/app-debug.apk
