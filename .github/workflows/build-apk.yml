name: Build & Release HyperMirror Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    name: Publish APK to GitHub Releases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create/Update GitHub Release v1.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "HyperMirror Pro v1.0.0 (Android Ultra-Low Latency APK)"
          body: |
            ## 🎮 HyperMirror Pro v1.0.0 — Android ➔ PC Gaming Screen Mirroring
            - **Zero-Copy Hardware Encoding**: `MediaProjection` + `MediaCodec` (H.264 AVC / H.265 HEVC)
            - **Ultra-Low Latency**: 60 / 90 / 120 FPS, `0 B-Frames`, `KEY_LOW_LATENCY`, `TCP_NODELAY`, `WIFI_MODE_FULL_LOW_LATENCY`
            - **Dual Transport**: Cáp USB (`adb forward` / `adb reverse`) & Wi-Fi 5GHz/6GHz

            ### 📲 Cài đặt trên Android
            Tải file **`HyperMirrorSender-debug.apk`** ở mục **Assets** bên dưới và cài đặt trực tiếp lên điện thoại Android (Android 8.0 - Android 14+).
          draft: false
          prerelease: false
          files: |
            HyperMirrorSender-debug.apk

  build-from-source:
    name: Verify & Build APK from Source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        working-directory: ./android-sender
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload HyperMirrorSender APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperMirrorSender-debug-apk
          path: android-sender/app/build/outputs/apk/debug/app-debug.apk
