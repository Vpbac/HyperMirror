name: Build HyperMirror Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        working-directory: ./android-sender
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload HyperMirrorSender APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperMirrorSender-debug-apk
          path: android-sender/app/build/outputs/apk/debug/app-debug.apk
